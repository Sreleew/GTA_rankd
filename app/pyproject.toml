[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-ranked-studio"
version = "0.8.7"
description = "Outil local d'automatisation vidéo pour une chaîne GTA VI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.4",
    "typer>=0.29.3",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "Pillow>=13.0.0",
    "yt-dlp>=2026.11.23",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0,<10", "httpx2>=2.16.2,<3", "ruff>=0.17.6,<0.18", "pip-audit>=2.10.1,<3"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
"studio.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
