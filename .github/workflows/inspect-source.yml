name: Inspect GTA Ranked Studio source internals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Extract and apply cumulative patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-checkout
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C source-checkout
          APP_ROOT="source-checkout/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP_ROOT"
          python source/apply-hotfix-v0.4.2.py "$APP_ROOT"
          python source/apply-hotfix-v0.5.0.py "$APP_ROOT"
          python source/apply-hotfix-v0.5.1.py "$APP_ROOT"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
      - name: Print relevant source modules for implementation review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("source-checkout/gta-ranked-studio")
          print("=== WEB SOURCE FILES ===")
          for p in sorted((root / "studio" / "web").rglob("*.py")):
              print(p.relative_to(root))
          targets = [
              "studio/web/metadata.py",
              "studio/web/short_editor.py",
              "studio/web/model_manager.py",
              "studio/web/store.py",
              "studio/web/highlights.py",
          ]
          for rel in targets:
              p = root / rel
              if p.exists():
                  print(f"\\n=== FILE {rel} ===")
                  print(p.read_text(encoding="utf-8-sig"))
          for rel in ["requirements.txt", "pyproject.toml"]:
              p = root / rel
              if p.exists():
                  print(f"\\n=== FILE {rel} ===")
                  print(p.read_text(encoding="utf-8-sig"))
          print("\\n=== STATIC FILES ===")
          for p in sorted((root / "studio" / "web" / "static").glob("*")):
              print(p.relative_to(root))
          print("\\n=== PROMPTS AND CONFIG PATHS ===")
          for p in sorted((root / "prompts").glob("*")) if (root / "prompts").exists() else []:
              print(p.relative_to(root))
          print("\\n=== EDITOR FUNCTION DETAILS ===")
          p = root / "studio/web/short_editor.py"
          lines = p.read_text(encoding="utf-8-sig").splitlines()
          for name in ("def create_ass_file", "def apply_thumbnail_overlay", "def write_srt_file"):
              start = next((i for i, line in enumerate(lines) if line.startswith(name)), None)
              if start is not None:
                  end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("def ")), len(lines))
                  print(f"\\n--- {name} ---")
                  for i in range(start, end):
                      print(f"{i+1:04d}: {lines[i]}")
          print("\\n=== STATIC UI SPEAKER/HOOK/OPTIONS REFERENCES ===")
          for p in sorted((root / "studio/web/static").glob("*.html")) + sorted((root / "studio/web/static").glob("*.js")):
              lines = p.read_text(encoding="utf-8-sig").splitlines()
              indices = [i for i, line in enumerate(lines) if any(term in line.lower() for term in ("hook_text", "webcam_zone", "captions_enabled", "create-short", "highlight-candidate", "source_range"))]
              print(f"\\n--- {p.relative_to(root)} ---")
              shown = set()
              for i in indices:
                  for j in range(max(0, i-3), min(len(lines), i+5)):
                      if j not in shown:
                          print(f"{j+1:04d}: {lines[j]}")
                          shown.add(j)
          print("\\n=== TARGETED WORKER/SCANNER/APIs ===")
          specs = {
              "studio/web/worker.py": ("def _download", "def _process"),
              "studio/web/highlights.py": ("def _download", "def _process"),
              "studio/web/app.py": (),
          }
          for rel, names in specs.items():
              p = root / rel
              lines = p.read_text(encoding="utf-8-sig").splitlines()
              print(f"\\n--- {rel} ---")
              if names:
                  for name in names:
                      starts = [i for i, line in enumerate(lines) if line.startswith(name)]
                      for start in starts:
                          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("    def ") or lines[i].startswith("def ")), min(len(lines), start + 180))
                          print(f"\\n[{name} at {start+1}]")
                          for i in range(start, min(end, start+220)):
                              print(f"{i+1:04d}: {lines[i]}")
              else:
                  for i, line in enumerate(lines):
                      if "highlight" in line.lower() or "candidate" in line.lower():
                          print(f"{i+1:04d}: {line}")
          print("\\n=== APP TRANSCRIPTION/CAPTION REFERENCES ===")
          p = root / "studio/web/app.py"
          lines = p.read_text(encoding="utf-8-sig").splitlines()
          needles = ("transcrib", "caption", "subtitle", "hook_text", "source_range", "speaker")
          ranges = set()
          for i, line in enumerate(lines):
              if any(n in line.lower() for n in needles):
                  ranges.update(range(max(0, i-5), min(len(lines), i+9)))
          last = -2
          for i in sorted(ranges):
              if i > last + 1:
                  print("...")
              print(f"{i+1:04d}: {lines[i]}")
              last = i
          PY
