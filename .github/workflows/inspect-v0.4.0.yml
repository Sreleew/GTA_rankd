name: Inspect GTA Ranked Studio v0.4.0 source

on:
  push:
    paths:
      - ".github/workflows/inspect-v0.4.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the proposed hotfix and validate it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          echo "=== Patched source package version ==="
          cat "$APP/VERSION.txt"
          grep -n '^version' "$APP/pyproject.toml"
          grep -n -A 3 -B 3 'version:' "$APP/config.yaml.default" | head -30
          echo "=== Patched FFprobe call ==="
          grep -n -B 2 -A 8 'probe_timeout_for_file\|timeout=probe_timeout' "$APP/studio/web/short_renderer.py" "$APP/studio/web/highlights.py"
          echo "=== Run regression tests after mocking FFprobe ==="
          python -m pip install --disable-pip-version-check pytest
          cd "$APP"
          python -m pytest -q tests/test_probe_timeout.py
