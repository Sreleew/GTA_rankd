name: Inspect GTA Ranked Studio v0.4.0 source

on:
  push:
    paths:
      - ".github/workflows/inspect-v0.4.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and inspect probe tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          echo "=== Probe tests/files ==="
          find "$APP/tests" -maxdepth 2 -type f -name '*.py' -print
          grep -R -n -B 8 -A 18 "probe_media\|run_command" "$APP/tests" | head -500 || true
          echo "=== Full download implementation ==="
          nl -ba "$APP/studio/web/highlights.py" | sed -n '400,510p'
          echo "=== Project version files ==="
          cat "$APP/VERSION.txt"
          grep -n '^version' "$APP/pyproject.toml"
          grep -n -A 3 -B 3 'version:' "$APP/config.yaml.default" | head -30
