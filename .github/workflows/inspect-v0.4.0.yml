name: Inspect GTA Ranked Studio v0.4.0 source

on:
  push:
    paths:
      - ".github/workflows/inspect-v0.4.0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and print highlight analysis flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          echo "=== highlights.py ==="
          nl -ba "$APP/studio/web/highlights.py" | sed -n '1,430p'
          echo "=== short_renderer.py command/probe helpers ==="
          nl -ba "$APP/studio/web/short_renderer.py" | sed -n '1,105p'
          echo "=== app.py scan routes ==="
          grep -n -B 12 -A 35 -Ei 'highlight|scan' "$APP/studio/web/app.py" | head -300 || true
