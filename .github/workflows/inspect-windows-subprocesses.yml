name: Inspect Windows subprocess console spawning

on:
  push:
    paths:
      - ".github/workflows/inspect-windows-subprocesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect subprocess launch sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== PYTHON SUBPROCESS CALL SITES ==="
          python - "$APP" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for p in sorted(root.rglob("*.py")):
              if any(part in {".venv","venv","node_modules"} for part in p.parts):
                  continue
              try: lines=p.read_text(encoding="utf-8-sig").splitlines()
              except Exception: continue
              hits=[i for i,l in enumerate(lines) if "subprocess." in l or "Popen(" in l or "CREATE_NO_WINDOW" in l or "STARTUPINFO" in l]
              if hits:
                  print(f"\n--- {p.relative_to(root)} ---")
                  shown=set()
                  for i in hits:
                      for j in range(max(0,i-5), min(len(lines),i+11)):
                          if j not in shown:
                              print(f"{j+1}: {lines[j]}")
                              shown.add(j)
          PY
          echo "=== BAT / POWERSHELL LAUNCHERS ==="
          find "$APP" -maxdepth 3 -type f \( -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' \) -print
          echo "=== INSTALLER FILE SELECTION ==="
          grep -n -B 3 -A 8 -E 'studio/web|launcher|\.bat|\.ps1' "$APP/installer/build_release_package.py" | head -250
