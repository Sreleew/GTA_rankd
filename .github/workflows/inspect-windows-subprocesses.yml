name: Inspect yt-dlp process creation flags

on:
  push:
    paths:
      - ".github/workflows/inspect-windows-subprocesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect yt-dlp Popen behavior
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check yt-dlp
          python -c "import inspect, yt_dlp.utils; print(inspect.getsource(yt_dlp.utils.Popen))"
          python -c "import yt_dlp.postprocessor.ffmpeg as f; print(inspect.getsource(f.FFmpegPostProcessor.run_ffmpeg))"
