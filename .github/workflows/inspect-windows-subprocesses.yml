name: Inspect v0.5 subprocess and config blocks
on:
  push:
    paths: [".github/workflows/inspect-windows-subprocesses.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print remaining v0.5 blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          for spec in \
            "studio/web/transcribe.py:45:110" \
            "studio/web/transcribe.py:235:330" \
            "studio/doctor.py:32:50" \
            "studio/web/app.py:105:120" \
            "studio/web/short_renderer.py:31:50" \
            "studio/web/short_renderer.py:119:178" \
            "studio/web/short_renderer.py:180:264" \
            "studio/web/short_renderer.py:264:370" \
            "studio/web/highlights.py:420:500" \
            "config.yaml.default:1:220"; do
              file="${spec%%:*}"
              rest="${spec#*:}"
              start="${rest%%:*}"
              end="${rest##*:}"
              echo "===== $file ($start-$end) ====="
              nl -ba "$APP/$file" | sed -n "${start},${end}p"
          done
          echo "===== IMPORTS ====="
          for f in studio/web/app.py studio/web/worker.py studio/web/short_renderer.py studio/web/transcribe.py studio/doctor.py; do
            echo "### $f"; head -35 "$APP/$f"
          done
