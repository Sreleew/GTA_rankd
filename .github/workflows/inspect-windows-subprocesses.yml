name: Inspect v0.5 focused functions

on:
  push:
    paths:
      - ".github/workflows/inspect-windows-subprocesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact implementation blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== HIGHLIGHTS SCORE ==="
          nl -ba "$APP/studio/web/highlights.py" | sed -n '90,195p'
          echo "=== HIGHLIGHTS PROCESS ==="
          nl -ba "$APP/studio/web/highlights.py" | sed -n '238,410p'
          echo "=== HIGHLIGHTS CREATE ROUTES ==="
          grep -R -n -B 10 -A 25 -E 'create_highlight|highlight.*candidate|media_start|media_end' "$APP/studio/web" --include='*.py' | head -500
          echo "=== RENDER FUNCTIONS ==="
          grep -n -E '^def |^class ' "$APP/studio/web/short_renderer.py"
          echo "=== RENDER CORE ==="
          nl -ba "$APP/studio/web/short_renderer.py" | sed -n '180,390p'
          echo "=== TRANSCRIBE PROCESS CORE ==="
          nl -ba "$APP/studio/web/transcribe.py" | sed -n '230,340p'
          echo "=== UI HIGHLIGHT TEMPLATE/JS ==="
          grep -n -B 8 -A 35 -E 'highlight-candidate|data-highlight-create|createShortFromHighlight|highlight-url-form' "$APP/studio/web/static/app.js" "$APP/studio/web/static/index.html"
