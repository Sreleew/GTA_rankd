name: Inspect v0.5 render worker mapping
on:
  push:
    paths: [".github/workflows/inspect-windows-subprocesses.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print worker render invocation and editor titles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== WORKER RENDER INVOCATIONS ==="
          grep -n -B 18 -A 70 'render_vertical_short(' "$APP/studio/web/worker.py"
          echo "=== SHORT EDITOR FUNCTIONS ==="
          grep -n -E '^def |hook_text|context_text|intro|title_card|Moment fort' "$APP/studio/web/short_editor.py" | head -250 || true
          echo "=== WORKER SOURCE RANGE / OPTIONS ==="
          grep -n -B 12 -A 30 'source_range' "$APP/studio/web/worker.py" || true
          echo "=== TEST RENDER INTEGRATION ==="
          grep -n -B 10 -A 35 'build_filter_complex\|build_render_command\|render_vertical_short' "$APP/tests/test_render_integration.py" "$APP/tests/test_highlights.py"
