name: Inspect v0.5 metadata and worker mapping
on:
  push:
    paths: [".github/workflows/inspect-windows-subprocesses.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print scan schema, post routes and worker options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== STORE SCHEMA ==="
          nl -ba "$APP/studio/web/store.py" | sed -n '60,140p'
          nl -ba "$APP/studio/web/store.py" | sed -n '250,395p'
          echo "=== APP ROUTES ==="
          nl -ba "$APP/studio/web/app.py" | sed -n '155,325p'
          echo "=== WORKER RENDER MAP ==="
          grep -n -B 10 -A 45 -E 'render_vertical_short|layout.*crop_x|crop_y|source_range' "$APP/studio/web/worker.py" | head -350 || true
          echo "=== JOB CREATE OPTIONS ==="
          grep -n -B 10 -A 30 -E 'options =|source_range|layout' "$APP/studio/web/app.py" | head -350 || true
          echo "=== UPDATE SCRIPT CONTENT ==="
          grep -n -B 4 -A 8 -E 'requirements|pip install|venv' "$APP/installer/apply_update.ps1" | head -150 || true
