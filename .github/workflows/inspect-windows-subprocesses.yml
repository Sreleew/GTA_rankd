name: Inspect v0.5 render graph and scan form
on:
  push:
    paths: [".github/workflows/inspect-windows-subprocesses.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print render graph, route and form
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== RENDER FILTER GRAPH ==="
          nl -ba "$APP/studio/web/short_renderer.py" | sed -n '107,190p'
          echo "=== BUILD RENDER COMMAND ==="
          nl -ba "$APP/studio/web/short_renderer.py" | sed -n '180,265p'
          echo "=== RENDER EXECUTION ==="
          nl -ba "$APP/studio/web/short_renderer.py" | sed -n '264,390p'
          echo "=== API ROUTES ==="
          nl -ba "$APP/studio/web/app.py" | sed -n '150,325p'
          echo "=== HIGHLIGHT FORMS ==="
          grep -n -B 10 -A 50 'highlight-url-form\|highlight-upload-form' "$APP/studio/web/static/index.html" || true
          echo "=== SUBPROCESS INVENTORY ==="
          python - "$APP" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for p in sorted(root.rglob("*.py")):
              if "tests" in p.parts: continue
              try: lines=p.read_text(encoding="utf-8-sig").splitlines()
              except Exception: continue
              for n,line in enumerate(lines,1):
                  if "subprocess.run(" in line or "subprocess.Popen(" in line:
                      print(f"{p.relative_to(root)}:{n}: {line.strip()}")
          PY
