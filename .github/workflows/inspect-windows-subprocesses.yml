name: Inspect v0.5 render and API hooks

on:
  push:
    paths:
      - ".github/workflows/inspect-windows-subprocesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print compact render and API implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== API ROUTES ==="
          grep -n -E 'highlights|create.*short|shorts/create' "$APP/studio/web/app.py"
          echo "=== RENDERER FUNCTION NAMES ==="
          grep -n -E '^def |^class ' "$APP/studio/web/short_renderer.py"
          echo "=== HIGHLIGHT STORE TABLE / METHODS ==="
          grep -n -E 'highlight|short_job|source_start|source_end|crop' "$APP/studio/web/store.py" | head -150
          echo "=== HIGHLIGHT JS FUNCTION ==="
          grep -n -A 65 -B 8 'function createShortFromHighlight' "$APP/studio/web/static/app.js"
          echo "=== HIGHLIGHT CARD RENDER ==="
          grep -n -A 60 -B 10 'function renderHighlight' "$APP/studio/web/static/app.js"
          echo "=== SHORT RENDER FUNCTION ==="
          grep -n -A 200 -B 8 '^def render_short' "$APP/studio/web/short_renderer.py"
          echo "=== APP SHORT ROUTES ==="
          nl -ba "$APP/studio/web/app.py" | sed -n '650,850p'
