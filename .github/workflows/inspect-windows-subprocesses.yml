name: Inspect GTA Ranked Studio v0.5 implementation points

on:
  push:
    paths:
      - ".github/workflows/inspect-windows-subprocesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and inspect highlight pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== HIGHLIGHTS CORE 1 ==="
          nl -ba "$APP/studio/web/highlights.py" | sed -n '1,260p'
          echo "=== HIGHLIGHTS CORE 2 ==="
          nl -ba "$APP/studio/web/highlights.py" | sed -n '260,560p'
          echo "=== RENDERER ==="
          nl -ba "$APP/studio/web/short_renderer.py" | sed -n '1,360p'
          echo "=== TRANSCRIPTION PROCESS CALLS ==="
          nl -ba "$APP/studio/web/transcribe.py" | sed -n '1,380p'
          echo "=== UI SCAN AND SHORTS TEMPLATES ==="
          grep -R -n -B 4 -A 12 -E 'Moments forts|Créer ce Short|highlight|candidate|candidate_seconds|35 secondes|35.0' "$APP/studio/web/static" | head -1000 || true
          echo "=== TEST INVENTORY ==="
          find "$APP/tests" -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort
          echo "=== PACKAGE BUILD SCRIPT ==="
          nl -ba "$APP/installer/build_release_package.py" | sed -n '1,260p'
