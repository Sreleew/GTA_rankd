name: Inspect v0.5 exact patch blocks
on:
  push:
    paths: [".github/workflows/inspect-windows-subprocesses.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print targeted source blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          for spec in \
            "studio/web/highlights.py:1:195" \
            "studio/web/highlights.py:253:420" \
            "studio/web/short_renderer.py:107:370" \
            "studio/web/transcribe.py:1:380" \
            "studio/web/app.py:195:323" \
            "studio/web/worker.py:225:260" \
            "studio/desktop_launcher.py:20:115" \
            "START-STUDIO.bat:1:100" \
            "START-STUDIO.vbs:1:100" \
            "installer/apply_update.ps1:90:112" \
            "tests/test_render_integration.py:1:120"; do
              file="${spec%%:*}"
              rest="${spec#*:}"
              start="${rest%%:*}"
              end="${rest##*:}"
              echo "===== $file ($start-$end) ====="
              nl -ba "$APP/$file" | sed -n "${start},${end}p"
          done
          echo "===== TRANSCRIBE SUBPROCESS BLOCKS ====="
          grep -n -A 18 -B 4 'subprocess.run(' "$APP/studio/web/transcribe.py"
          echo "===== WINDOWS ENTRYPOINTS ====="
          for file in "$APP/START-STUDIO.bat" "$APP/START-STUDIO.vbs" "$APP/INSTALL.bat"; do
            if [ -f "$file" ]; then echo "### $file"; cat "$file"; fi
          done
