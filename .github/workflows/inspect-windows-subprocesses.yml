name: Validate GTA Ranked Studio v0.5 patch

on:
  push:
    paths:
      - "source/apply-hotfix-v0.5.0.py"
      - ".github/workflows/inspect-windows-subprocesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Extract source and apply all cumulative patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          python source/apply-hotfix-v0.5.0.py "$APP"
          test "$(grep -E '^Version:' "$APP/VERSION.txt" | awk '{print $2}')" = "0.5.0"
          python -m compileall -q "$APP/studio" "$APP/tests"
          echo "Version v0.5.0 patch applied and Python sources compile."
      - name: Install FFmpeg and application dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r /tmp/gta-source/gta-ranked-studio/requirements.txt
      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gta-source/gta-ranked-studio
          cp config.yaml.default config.yaml
          trap 'rm -f config.yaml' EXIT
          python -m pytest -q
