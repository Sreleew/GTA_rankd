name: Windows runtime validation

on:
  push:
    branches: [main, chore/clean-source-layout, "feature/**"]
    paths:
      - "app/**"
      - ".github/workflows/windows-smoke.yml"
      - ".github/workflows/audit-source.yml"
      - ".github/workflows/release.yml"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v*.txt"
      - "docs/**"
      - "tools/check_project_memory.py"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/windows-smoke.yml"
      - ".github/workflows/audit-source.yml"
      - ".github/workflows/release.yml"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v*.txt"
      - "docs/**"
      - "tools/check_project_memory.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-ranked-windows-smoke
  cancel-in-progress: false

jobs:
  windows-smoke:
    name: Windows tests, PowerShell and update package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem -Path "$env:ProgramData\chocolatey\lib" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg) {
            $command = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
            if ($command) { $ffmpegPath = Split-Path $command.Source -Parent }
          } else {
            $ffmpegPath = Split-Path $ffmpeg.FullName -Parent
          }
          if (-not $ffmpegPath) { throw "FFmpeg installé mais ffmpeg.exe introuvable." }
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegPath
          $env:Path = "$ffmpegPath;$env:Path"
          ffmpeg -version
          ffprobe -version

      - name: Verify source layout and synchronize release metadata
        shell: pwsh
        run: |
          $appRoot = Join-Path $env:GITHUB_WORKSPACE "app"
          foreach ($required in @(
            "studio\web\app.py",
            "studio\web\updater.py",
            "installer\build_release_package.py",
            "tests\test_web.py"
          )) {
            if (-not (Test-Path (Join-Path $appRoot $required) -PathType Leaf)) {
              throw "Fichier source requis absent : $required"
            }
          }
          $rootVersionText = Get-Content (Join-Path $env:GITHUB_WORKSPACE "VERSION.txt") -Raw
          $appVersionText = Get-Content (Join-Path $appRoot "VERSION.txt") -Raw
          if ($rootVersionText -notmatch '(?m)^Version:\s*([0-9]+(?:\.[0-9]+){2,3})\s*$') {
            throw "VERSION.txt racine invalide."
          }
          $rootVersion = $Matches[1]
          if ($appVersionText -notmatch '(?m)^Version:\s*([0-9]+(?:\.[0-9]+){2,3})\s*$' -or $Matches[1] -ne $rootVersion) {
            throw "La version racine et la version de app/ doivent être identiques."
          }
          $notes = Join-Path $env:GITHUB_WORKSPACE "NOTES-v$rootVersion.txt"
          if (-not (Test-Path $notes -PathType Leaf)) { throw "Notes de version absentes : $notes" }
          New-Item -ItemType Directory -Path (Join-Path $appRoot "docs") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $appRoot "tools") -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "VERSION.txt") (Join-Path $appRoot "VERSION.txt") -Force
          Copy-Item $notes (Join-Path $appRoot "NOTES-v$rootVersion.txt") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "docs\CONTINUATION.md") (Join-Path $appRoot "docs\CONTINUATION.md") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "docs\UPDATES.md") (Join-Path $appRoot "docs\UPDATES.md") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "docs\implementation-plan-v0.7.8.md") (Join-Path $appRoot "docs\implementation-plan-v0.7.8.md") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "tools\check_project_memory.py") (Join-Path $appRoot "tools\check_project_memory.py") -Force
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "APP_VERSION=$rootVersion" + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "APP_ROOT=$appRoot" + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r "$env:APP_ROOT\requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw "Installation des dépendances impossible." }

      - name: Validate project memory and run full Windows test suite
        shell: pwsh
        run: |
          Set-Location $env:APP_ROOT
          Copy-Item config.yaml.default config.yaml -Force
          try {
            python tools/check_project_memory.py
            if ($LASTEXITCODE -ne 0) { throw "Le contrôle du mémo a échoué." }
            python -m pytest -q
            if ($LASTEXITCODE -ne 0) { throw "La suite de tests Windows a échoué." }
            node --check studio/web/static/app.js
            if ($LASTEXITCODE -ne 0) { throw "Le contrôle syntaxique JavaScript a échoué." }
          }
          finally {
            Remove-Item config.yaml -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows update package
        shell: pwsh
        run: |
          python "$env:APP_ROOT\installer\build_release_package.py" --version "$env:APP_VERSION" --output-dir "$env:GITHUB_WORKSPACE\dist-windows"
          if ($LASTEXITCODE -ne 0) { throw "La construction du paquet Windows a échoué." }

      - name: Verify Windows package contents and exclusions
        shell: pwsh
        run: |
          @'
          import hashlib
          import sys
          import zipfile
          from pathlib import PurePosixPath

          package_path, checksum_path, version = sys.argv[1:]
          required = {
              "gta-ranked-studio/VERSION.txt",
              "gta-ranked-studio/installer/apply_update.ps1",
              "gta-ranked-studio/studio/web/updater.py",
              "gta-ranked-studio/docs/CONTINUATION.md",
              "gta-ranked-studio/docs/UPDATES.md",
              "gta-ranked-studio/tools/check_project_memory.py",
          }
          with zipfile.ZipFile(package_path) as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit("Fichiers requis absents : " + ", ".join(sorted(missing)))
              if archive.testzip():
                  raise SystemExit("ZIP Windows corrompu.")
              version_text = archive.read("gta-ranked-studio/VERSION.txt").decode("utf-8-sig")
              if f"Version: {version}" not in version_text:
                  raise SystemExit("Version du ZIP incorrecte.")
              forbidden = []
              for name in names:
                  path = PurePosixPath(name)
                  if path.name in {"config.yaml", "secrets.json", "credentials.json"} or path.name.startswith(".env") or path.suffix.lower() in {".sqlite", ".sqlite3", ".db", ".log", ".pyc", ".pem", ".key"}:
                      forbidden.append(name)
              if forbidden:
                  raise SystemExit("Fichiers locaux/sensibles détectés : " + ", ".join(sorted(forbidden)))
          digest = hashlib.sha256(open(package_path, "rb").read()).hexdigest()
          if digest not in open(checksum_path, encoding="utf-8").read():
              raise SystemExit("Checksum du ZIP incorrect.")
          print("ZIP Windows vérifié et données personnelles exclues.")
          '@ | python - "$env:GITHUB_WORKSPACE\dist-windows\GTA-Ranked-Studio-v$env:APP_VERSION.zip" "$env:GITHUB_WORKSPACE\dist-windows\SHA256SUMS.txt" "$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "La vérification du paquet Windows a échoué." }

      - name: Upload Windows validation package
        uses: actions/upload-artifact@v4
        with:
          name: gta-ranked-studio-windows-validation
          path: dist-windows/
          retention-days: 14
