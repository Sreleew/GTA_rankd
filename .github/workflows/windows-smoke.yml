name: Windows runtime validation

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/**"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".gitattributes"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v*.txt"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/**"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".gitattributes"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v*.txt"
      - ".release-approval"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-ranked-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Windows tests, PowerShell and package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem -Path "$env:ProgramData\chocolatey\lib" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg) {
            $command = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
            if ($command) { $ffmpegPath = Split-Path $command.Source -Parent }
          } else {
            $ffmpegPath = Split-Path $ffmpeg.FullName -Parent
          }
          if (-not $ffmpegPath) { throw "FFmpeg installé mais ffmpeg.exe introuvable." }
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegPath
          $env:Path = "$ffmpegPath;$env:Path"
          ffmpeg -version
          ffprobe -version

      - name: Install application and development dependencies
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "app")
          try {
            python -m pip install --disable-pip-version-check -e ".[dev]"
            if ($LASTEXITCODE -ne 0) { throw "Installation des dépendances de développement impossible." }
            python -m pip check
            if ($LASTEXITCODE -ne 0) { throw "pip check a détecté des dépendances incohérentes." }
          }
          finally {
            Pop-Location
          }

      - name: Run static analysis and dependency security audit
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "app")
          try {
            ruff check studio installer tests ..\tools
            if ($LASTEXITCODE -ne 0) { throw "Ruff a détecté des problèmes dans le code Python." }
            pip-audit -r requirements.txt
            if ($LASTEXITCODE -ne 0) { throw "L'audit de vulnérabilités des dépendances a échoué." }
          }
          finally {
            Pop-Location
          }

      - name: Verify source structure and release metadata
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\tools\check_project_memory.py" --root "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "Le contrôle de structure/version/documentation a échoué." }
          git show --check --oneline HEAD
          if ($LASTEXITCODE -ne 0) { throw "git show --check --oneline HEAD a échoué." }
          $rootVersionText = Get-Content (Join-Path $env:GITHUB_WORKSPACE "VERSION.txt") -Raw
          $appVersionText = Get-Content (Join-Path $env:GITHUB_WORKSPACE "app\VERSION.txt") -Raw
          $rootMatch = [regex]::Match($rootVersionText, '(?m)^Version:\s*([0-9]+(?:\.[0-9]+){2,3})\s*$')
          $appMatch = [regex]::Match($appVersionText, '(?m)^Version:\s*([0-9]+(?:\.[0-9]+){2,3})\s*$')
          if (-not $rootMatch.Success -or -not $appMatch.Success -or $rootMatch.Groups[1].Value -ne $appMatch.Groups[1].Value) {
            throw "Les versions racine et app doivent être valides et identiques."
          }
          $version = $rootMatch.Groups[1].Value
          $project = Get-Content (Join-Path $env:GITHUB_WORKSPACE "app\pyproject.toml") -Raw
          $projectPattern = '(?m)^version = "{0}"\r?$' -f [regex]::Escape($version)
          if ($project -notmatch $projectPattern) {
            throw "La version de pyproject.toml ne correspond pas à VERSION.txt."
          }
          $rootNotes = Join-Path $env:GITHUB_WORKSPACE "NOTES-v$version.txt"
          $appNotes = Join-Path $env:GITHUB_WORKSPACE "app\NOTES-v$version.txt"
          if (-not (Test-Path $rootNotes -PathType Leaf) -or -not (Test-Path $appNotes -PathType Leaf)) {
            throw "Notes de version manquantes pour v$version."
          }
          if ((Get-FileHash $rootNotes -Algorithm SHA256).Hash -ne (Get-FileHash $appNotes -Algorithm SHA256).Hash) {
            throw "Les notes de version racine et app doivent être identiques."
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "APP_VERSION=$version" + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

      - name: Validate developer PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/dev-setup.ps1",
            "scripts/test-quick.ps1",
            "scripts/test-full.ps1"
          )
          foreach ($relativePath in $scripts) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relativePath
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $details = ($errors | ForEach-Object { $_.Message }) -join "; "
              throw "Erreur de syntaxe PowerShell dans $relativePath : $details"
            }
          }

      - name: Run complete Windows regression suite
        shell: pwsh
        run: |
          $appRoot = Join-Path $env:GITHUB_WORKSPACE "app"
          Push-Location $appRoot
          Copy-Item config.yaml.default config.yaml -Force
          try {
            python -m compileall -q studio installer tests
            if ($LASTEXITCODE -ne 0) { throw "Compilation Python en échec." }
            python -m pytest -q
            if ($LASTEXITCODE -ne 0) { throw "La suite de tests Windows a échoué." }
            node --check studio/web/static/app.js
            if ($LASTEXITCODE -ne 0) { throw "Le contrôle syntaxique JavaScript a échoué." }
          }
          finally {
            Remove-Item config.yaml -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Build and verify sanitized Windows update package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist-windows"
          python "$env:GITHUB_WORKSPACE\app\installer\build_release_package.py" --version "$env:APP_VERSION" --output-dir $dist
          if ($LASTEXITCODE -ne 0) { throw "La construction du package Windows a échoué." }
          $package = Join-Path $dist "GTA-Ranked-Studio-v$env:APP_VERSION.zip"
          $checksum = Join-Path $dist "SHA256SUMS.txt"
          python "$env:GITHUB_WORKSPACE\tools\verify_release_package.py" --package $package --checksum $checksum --version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "La vérification du package Windows a échoué." }

      - name: Upload validated Windows package
        uses: actions/upload-artifact@v7
        with:
          name: gta-ranked-studio-v${{ env.APP_VERSION }}-windows-validated
          path: dist-windows/
          retention-days: 14
