name: Bootstrap direct application source (one-time migration)

on:
  push:
    branches: [chore/clean-source-layout]
    paths:
      - ".github/workflows/bootstrap-direct-source.yml"

permissions:
  contents: write

concurrency:
  group: gta-ranked-source-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Verify, reconstruct, test and commit the v0.7.8 application tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up project Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify and safely reconstruct canonical source
        shell: bash
        run: |
          set -euo pipefail
          python - "source/canonical-v0.7.8" "source/canonical-v0.7.8/GTA-Ranked-Studio-source-v0.7.8.tar.xz" "source-checkout" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          snapshot_dir, archive_path, output_root = map(Path, sys.argv[1:])
          manifest = json.loads((snapshot_dir / "MANIFEST.json").read_text(encoding="utf-8"))
          sums = (snapshot_dir / "SHA256SUMS.txt").read_text(encoding="utf-8").split()
          archive_sha = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if manifest.get("version") != "0.7.8":
              raise SystemExit("La source de départ n'est pas v0.7.8.")
          if len(sums) < 2 or sums[0] != archive_sha or manifest.get("archive_sha256") != archive_sha:
              raise SystemExit("Checksum de l'archive canonique invalide.")

          expected = {item["path"]: item for item in manifest["files"]}
          if len(expected) != manifest.get("file_count"):
              raise SystemExit("Le nombre de fichiers du manifeste est incohérent.")

          actual = {}
          output_root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "r:xz") as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Entrée non sûre : {member.name}")
                  if len(path.parts) < 2 or path.parts[0] != "gta-ranked-studio":
                      raise SystemExit(f"Racine inattendue : {member.name}")
                  relative = PurePosixPath(*path.parts[1:]).as_posix()
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Fichier illisible : {member.name}")
                  data = source.read()
                  actual[relative] = {"size": len(data), "sha256": hashlib.sha256(data).hexdigest()}
                  target = output_root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          if set(actual) != set(expected):
              raise SystemExit("L'inventaire reconstruit diffère du manifeste.")
          for name, item in expected.items():
              if actual[name] != {"size": item["size"], "sha256": item["sha256"]}:
                  raise SystemExit(f"Empreinte invalide : {name}")

          app_root = output_root / "gta-ranked-studio"
          if "Version: 0.7.8" not in (app_root / "VERSION.txt").read_text(encoding="utf-8-sig"):
              raise SystemExit("La version reconstruite ne correspond pas à v0.7.8.")
          print(f"Source canonique vérifiée : {len(actual)} fichiers, archive SHA-256 {archive_sha}.")
          PY

      - name: Apply the two active v0.7.8 application patches
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$GITHUB_WORKSPACE/source-checkout/gta-ranked-studio"
          python source/apply-hotfix-v0.7.8-retention.py "$APP_ROOT"
          python source/apply-hotfix-v0.7.8-export-qc.py "$APP_ROOT"

      - name: Synchronize current project documentation
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$GITHUB_WORKSPACE/source-checkout/gta-ranked-studio"
          mkdir -p "$APP_ROOT/docs" "$APP_ROOT/tools"
          cp README.md "$APP_ROOT/README.md"
          cp VERSION.txt "$APP_ROOT/VERSION.txt"
          cp NOTES-v0.7.8.txt "$APP_ROOT/NOTES-v0.7.8.txt"
          cp docs/CONTINUATION.md "$APP_ROOT/docs/CONTINUATION.md"
          cp docs/UPDATES.md "$APP_ROOT/docs/UPDATES.md"
          cp docs/implementation-plan-v0.7.8.md "$APP_ROOT/docs/implementation-plan-v0.7.8.md"
          cp tools/check_project_memory.py "$APP_ROOT/tools/check_project_memory.py"
          python "$APP_ROOT/tools/check_project_memory.py" --root "$APP_ROOT"

      - name: Normalize extracted file timestamps for ZIP compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$GITHUB_WORKSPACE/source-checkout/gta-ranked-studio"
          find "$APP_ROOT" -type f -exec touch -m -d '1980-01-01 00:00:00 UTC' -- {} +
          python - "$APP_ROOT" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          minimum = 315532800
          invalid = [str(p.relative_to(root)) for p in root.rglob("*") if p.is_file() and p.stat().st_mtime < minimum]
          if invalid:
              raise SystemExit("Dates incompatibles ZIP : " + ", ".join(invalid))
          PY

      - name: Install FFmpeg and application dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r source-checkout/gta-ranked-studio/requirements.txt

      - name: Run full Linux tests and frontend syntax check
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$GITHUB_WORKSPACE/source-checkout/gta-ranked-studio"
          cd "$APP_ROOT"
          cp config.yaml.default config.yaml
          trap 'rm -f config.yaml' EXIT
          python tools/check_project_memory.py
          python -m pytest -q
          node --check studio/web/static/app.js

      - name: Build and verify the Windows update package
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$GITHUB_WORKSPACE/source-checkout/gta-ranked-studio"
          python "$APP_ROOT/installer/build_release_package.py" --version 0.7.8 --output-dir "$GITHUB_WORKSPACE/dist"
          python - "$GITHUB_WORKSPACE/dist/GTA-Ranked-Studio-v0.7.8.zip" <<'PY'
          import hashlib
          import sys
          import zipfile
          from pathlib import PurePosixPath
          package = sys.argv[1]
          required = {
              "gta-ranked-studio/VERSION.txt",
              "gta-ranked-studio/docs/CONTINUATION.md",
              "gta-ranked-studio/docs/UPDATES.md",
              "gta-ranked-studio/tools/check_project_memory.py",
          }
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit("Fichiers requis absents : " + ", ".join(sorted(missing)))
              forbidden = []
              for name in names:
                  p = PurePosixPath(name)
                  if p.name in {"config.yaml", "secrets.json", "credentials.json"} or p.name.startswith(".env") or p.suffix.lower() in {".sqlite", ".sqlite3", ".db", ".log", ".pyc", ".pem", ".key"}:
                      forbidden.append(name)
              if forbidden:
                  raise SystemExit("Données locales/sensibles dans le ZIP : " + ", ".join(sorted(forbidden)))
              if archive.testzip():
                  raise SystemExit("ZIP corrompu.")
          digest = hashlib.sha256(open(package, "rb").read()).hexdigest()
          checksum = open(package.replace("GTA-Ranked-Studio-v0.7.8.zip", "SHA256SUMS.txt"), encoding="utf-8").read()
          if digest not in checksum:
              raise SystemExit("Checksum du ZIP incorrect.")
          print("ZIP v0.7.8 valide et données utilisateur exclues.")
          PY

      - name: Promote the verified application source into app/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cp -a source-checkout/gta-ranked-studio/. app/
          python tools/check_project_memory.py --root app
          git status --short
          git add app/
          if git diff --cached --quiet; then
            echo "app/ est déjà à jour."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: expand verified v0.7.8 runtime into app/"
            git push origin HEAD:chore/clean-source-layout
          fi

      - name: Upload verified expanded source
        uses: actions/upload-artifact@v4
        with:
          name: gta-ranked-studio-v0.7.8-expanded-source
          path: app/
          retention-days: 7
