name: Audit GTA Ranked Studio application

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/**"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".gitattributes"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v*.txt"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/**"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v*.txt"
      - ".release-approval"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-ranked-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Linux tests and Windows package validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install application and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "app[dev]"
          python -m pip check

      - name: Run static analysis and dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          ruff check app/studio app/installer app/tests tools
          python -m pip-audit -r app/requirements.txt

      - name: Verify repository structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_project_memory.py --root .
          git show --check --oneline HEAD
          test -f app/studio/web/app.py
          test -f app/tests/test_web.py
          test -f tools/verify_release_package.py

      - name: Run Linux regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd app
          cp config.yaml.default config.yaml
          trap 'rm -f config.yaml' EXIT
          python -m compileall -q studio installer tests
          python -m pytest -q
          node --check studio/web/static/app.js

      - name: Build sanitized Windows update package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+(\.[0-9]+){2,3})[[:space:]]*$/\1/p' VERSION.txt | head -n 1)"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          python app/installer/build_release_package.py --version "$VERSION" --output-dir "$GITHUB_WORKSPACE/dist"
          python tools/verify_release_package.py \
            --package "$GITHUB_WORKSPACE/dist/GTA-Ranked-Studio-v$VERSION.zip" \
            --checksum "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt" \
            --version "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: gta-ranked-studio-v${{ env.APP_VERSION }}-linux-validated
          path: dist/
          retention-days: 14
