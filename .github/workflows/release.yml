name: Build and publish GTA Ranked Studio

on:
  push:
    branches: [main]
    paths:
      - "source/GTA-Ranked-Studio-source-v0.4.0.tar.xz"
      - "source/apply-hotfix-v0.4.1.py"
      - "source/apply-hotfix-v0.4.2.py"
      - "source/apply-hotfix-v0.5.0.py"
      - "source/apply-hotfix-v0.5.1.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (doit correspondre à la version produite par les correctifs source)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-gta-ranked-studio
  cancel-in-progress: false

jobs:
  release:
    name: Test, build update package and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract v0.4.0 base snapshot and apply cumulative v0.4.1, v0.4.2, v0.5.0 and v0.5.1 fixes
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="source/GTA-Ranked-Studio-source-v0.4.0.tar.xz"
          EXPECTED_SHA256="bbf35740febed311d7788b42edb569a1b9afcfd89bee449d9dbf62d8b07162e9"

          test -s "$SNAPSHOT"
          echo "$EXPECTED_SHA256  $SNAPSHOT" | sha256sum --check -
          file "$SNAPSHOT"
          xz -t "$SNAPSHOT"

          mkdir -p source-checkout
          tar -xJf "$SNAPSHOT" -C source-checkout
          APP_ROOT="source-checkout/gta-ranked-studio"
          test -f "$APP_ROOT/VERSION.txt"
          python source/apply-hotfix-v0.4.1.py "$APP_ROOT"
          python source/apply-hotfix-v0.4.2.py "$APP_ROOT"
          python source/apply-hotfix-v0.5.0.py "$APP_ROOT"
          python source/apply-hotfix-v0.5.1.py "$APP_ROOT"

          APP_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+(\.[0-9]+){2,3})[[:space:]]*$/\1/p' "$APP_ROOT/VERSION.txt" | head -n 1)"
          if [ "$APP_VERSION" != "0.5.1" ]; then
            echo "Les correctifs doivent produire la version 0.5.1, version trouvée : ${APP_VERSION:-absente}."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REQUESTED_VERSION="${{ inputs.version }}"
            REQUESTED_VERSION="${REQUESTED_VERSION#v}"
            if [ -z "$REQUESTED_VERSION" ]; then REQUESTED_VERSION="$APP_VERSION"; fi
          else
            REQUESTED_VERSION="$APP_VERSION"
          fi
          if [ "$REQUESTED_VERSION" != "$APP_VERSION" ]; then
            echo "Version demandée ($REQUESTED_VERSION) différente du paquet produit ($APP_VERSION)."
            exit 1
          fi

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"

      - name: Install FFmpeg for command-builder and integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -r "$APP_ROOT/requirements.txt"

      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          cp config.yaml.default config.yaml
          trap 'rm -f config.yaml' EXIT
          python -m pytest -q

      - name: Build sanitized Windows update ZIP
        run: python "$APP_ROOT/installer/build_release_package.py" --version "$APP_VERSION" --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Prepare release notes
        shell: bash
        run: |
          NOTES="$APP_ROOT/NOTES-v${APP_VERSION}.txt"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" "$GITHUB_WORKSPACE/dist/release-notes.md"
          else
            printf 'GTA Ranked Studio v%s\n\nMise à jour stable.\n' "$APP_VERSION" > "$GITHUB_WORKSPACE/dist/release-notes.md"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: GTA Ranked Studio ${{ env.RELEASE_TAG }}
          body_path: dist/release-notes.md
          files: |
            dist/GTA-Ranked-Studio-${{ env.RELEASE_TAG }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
