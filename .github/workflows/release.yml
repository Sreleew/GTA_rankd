name: Build and publish GTA Ranked Studio

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (doit correspondre au VERSION.txt du snapshot)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-gta-ranked-studio
  cancel-in-progress: false

jobs:
  release:
    name: Build update package and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract source snapshot and validate version
        shell: bash
        run: |
          mkdir -p source-checkout
          tar -xJf source/GTA-Ranked-Studio-source.tar.xz -C source-checkout
          APP_ROOT="source-checkout/gta-ranked-studio"
          APP_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+(\.[0-9]+){2,3})[[:space:]]*$/\1/p' "$APP_ROOT/VERSION.txt" | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            echo "VERSION.txt du snapshot est absent ou invalide."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REQUESTED_VERSION="${{ inputs.version }}"
            REQUESTED_VERSION="${REQUESTED_VERSION#v}"
          else
            REQUESTED_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$REQUESTED_VERSION" != "$APP_VERSION" ]; then
            echo "Version demandée ($REQUESTED_VERSION) différente du snapshot ($APP_VERSION)."
            exit 1
          fi
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build sanitized Windows update ZIP
        run: python installer/build_release_package.py --version "${APP_VERSION}" --output-dir "${GITHUB_WORKSPACE}/dist"
        working-directory: ${{ env.APP_ROOT }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: GTA Ranked Studio ${{ env.RELEASE_TAG }}
          body_path: ${{ env.APP_ROOT }}/NOTES-v0.3.4.txt
          files: |
            dist/GTA-Ranked-Studio-${{ env.RELEASE_TAG }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
