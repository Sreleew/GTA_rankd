name: Build and publish GTA Ranked Studio

on:
  push:
    branches: [main]
    paths:
      - "source/canonical-v0.7.8/**"
      - "docs/CONTINUATION.md"
      - "docs/UPDATES.md"
      - "tools/check_project_memory.py"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v0.7.8.txt"
      - "docs/CONTINUATION.md"
      - "docs/UPDATES.md"
      - "tools/check_project_memory.py"
      - "README.md"
      - "VERSION.txt"
      - "NOTES-v0.7.8.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (doit correspondre à la version produite par les correctifs source)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-gta-ranked-studio
  cancel-in-progress: false

jobs:
  release:
    name: Test, build update package and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract and verify canonical v0.7.8 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_DIR="source/canonical-v0.7.8"
          SNAPSHOT="$SNAPSHOT_DIR/GTA-Ranked-Studio-source-v0.7.8.tar.xz"
          test -s "$SNAPSHOT"
          (cd "$SNAPSHOT_DIR" && sha256sum --check SHA256SUMS.txt)
          xz -t "$SNAPSHOT"

          mkdir -p source-checkout
          tar -xJf "$SNAPSHOT" -C source-checkout
          APP_ROOT="source-checkout/gta-ranked-studio"
          test -f "$APP_ROOT/VERSION.txt"
          APP_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+(\.[0-9]+){2,3})[[:space:]]*$/\1/p' "$APP_ROOT/VERSION.txt" | head -n 1)"
          if [ "$APP_VERSION" != "0.7.8" ]; then
            echo "Le snapshot canonique doit être en v0.7.8, version trouvée : ${APP_VERSION:-absente}."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REQUESTED_VERSION="${{ inputs.version }}"
            REQUESTED_VERSION="${REQUESTED_VERSION#v}"
            if [ -z "$REQUESTED_VERSION" ]; then REQUESTED_VERSION="$APP_VERSION"; fi
          else
            REQUESTED_VERSION="$APP_VERSION"
          fi
          if [ "$REQUESTED_VERSION" != "$APP_VERSION" ]; then
            echo "Version demandée ($REQUESTED_VERSION) différente du snapshot canonique ($APP_VERSION)."
            exit 1
          fi

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION" >> "$GITHUB_ENV"

      - name: Inject current documentation and validate project memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_ROOT/docs" "$APP_ROOT/tools"
          cp README.md "$APP_ROOT/README.md"
          cp VERSION.txt "$APP_ROOT/VERSION.txt"
          cp "NOTES-v$APP_VERSION.txt" "$APP_ROOT/NOTES-v$APP_VERSION.txt"
          cp docs/CONTINUATION.md "$APP_ROOT/docs/CONTINUATION.md"
          cp docs/UPDATES.md "$APP_ROOT/docs/UPDATES.md"
          cp tools/check_project_memory.py "$APP_ROOT/tools/check_project_memory.py"
          python "$APP_ROOT/tools/check_project_memory.py" --root "$APP_ROOT"

      - name: Install FFmpeg for command-builder and integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -r "$APP_ROOT/requirements.txt"

      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          cp config.yaml.default config.yaml
          trap 'rm -f config.yaml' EXIT
          python "$APP_ROOT/tools/check_project_memory.py" --root "$APP_ROOT"
          python -m pytest -q
          node --check studio/web/static/app.js

      - name: Build sanitized Windows update ZIP
        run: python "$APP_ROOT/installer/build_release_package.py" --version "$APP_VERSION" --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Verify continuation memory is included in the Windows package
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/dist/GTA-Ranked-Studio-v${APP_VERSION}.zip" <<'PY'
          import sys
          import zipfile
          required = {
              "gta-ranked-studio/docs/CONTINUATION.md",
              "gta-ranked-studio/tools/check_project_memory.py",
              "gta-ranked-studio/docs/UPDATES.md",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              missing = required - set(archive.namelist())
          if missing:
              raise SystemExit("Package is missing continuity files: " + ", ".join(sorted(missing)))
          print("Continuation memo, checker and update history are included in the Windows ZIP.")
          PY
      - name: Prepare release notes
        shell: bash
        run: |
          NOTES="$APP_ROOT/NOTES-v${APP_VERSION}.txt"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" "$GITHUB_WORKSPACE/dist/release-notes.md"
          else
            printf 'GTA Ranked Studio v%s\n\nMise à jour stable.\n' "$APP_VERSION" > "$GITHUB_WORKSPACE/dist/release-notes.md"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: GTA Ranked Studio ${{ env.RELEASE_TAG }}
          body_path: dist/release-notes.md
          files: |
            dist/GTA-Ranked-Studio-${{ env.RELEASE_TAG }}.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
