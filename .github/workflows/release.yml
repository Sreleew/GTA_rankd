name: Build and publish GTA Ranked Studio

on:
  push:
    branches: [main]
    paths:
      - ".release-approval"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à préparer (ex. 0.8.1)"
        required: true
        type: string
      confirm_publish:
        description: "Confirmer la préparation de la Release brouillon"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-gta-ranked-studio
  cancel-in-progress: false

jobs:
  release:
    name: Verify, test, package and publish an explicitly approved release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate release approval and synchronized versions
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refus : une Release doit être préparée depuis main."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$CONFIRM_PUBLISH" != "true" ]]; then
              echo "Refus : la confirmation explicite n'a pas été cochée."
              exit 1
            fi
            VERSION="${VERSION_INPUT#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test -s .release-approval
            VERSION="$(tr -d '[:space:]' < .release-approval)"
            VERSION="${VERSION#v}"
          else
            echo "Événement de publication non pris en charge."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Version invalide : $VERSION"
            exit 1
          fi
          ROOT_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+(\.[0-9]+){2,3})[[:space:]]*$/\1/p' VERSION.txt | head -n 1)"
          APP_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9]+(\.[0-9]+){2,3})[[:space:]]*$/\1/p' app/VERSION.txt | head -n 1)"
          PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("app/pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$VERSION" != "$ROOT_VERSION" || "$VERSION" != "$APP_VERSION" || "$VERSION" != "$PYPROJECT_VERSION" ]]; then
            echo "Version incohérente : approval=$VERSION root=$ROOT_VERSION app=$APP_VERSION pyproject=$PYPROJECT_VERSION."
            exit 1
          fi
          if [[ ! -s "NOTES-v$VERSION.txt" || ! -s "app/NOTES-v$VERSION.txt" ]]; then
            echo "Notes de version absentes pour v$VERSION."
            exit 1
          fi
          if ! cmp -s "NOTES-v$VERSION.txt" "app/NOTES-v$VERSION.txt"; then
            echo "Les notes racine et app doivent être identiques."
            exit 1
          fi
          RELEASE_TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refus : le tag $RELEASE_TAG existe déjà."
            exit 1
          fi
          {
            echo "APP_VERSION=$VERSION"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "APP_ROOT=$GITHUB_WORKSPACE/app"
          } >> "$GITHUB_ENV"

      - name: Install FFmpeg and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          python -m pip install --disable-pip-version-check -e "$APP_ROOT[dev]"
          python -m pip check

      - name: Run static analysis and dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          ruff check studio installer tests "$GITHUB_WORKSPACE/tools"
          python -m pip-audit -r requirements.txt

      - name: Validate source and run complete tests
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_project_memory.py --root .
          git show --check --oneline HEAD
          cd "$APP_ROOT"
          cp config.yaml.default config.yaml
          trap 'rm -f config.yaml' EXIT
          python -m compileall -q studio installer tests
          python -m pytest -q
          node --check studio/web/static/app.js

      - name: Build sanitized Windows update ZIP
        shell: bash
        run: |
          set -euo pipefail
          python "$APP_ROOT/installer/build_release_package.py" --version "$APP_VERSION" --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Verify ZIP contents, exclusions and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_release_package.py \
            --package "$GITHUB_WORKSPACE/dist/GTA-Ranked-Studio-v$APP_VERSION.zip" \
            --checksum "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt" \
            --version "$APP_VERSION"

      - name: Prepare release notes
        shell: bash
        run: cp "NOTES-v$APP_VERSION.txt" "$GITHUB_WORKSPACE/dist/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: GTA Ranked Studio ${{ env.RELEASE_TAG }}
          body_path: dist/release-notes.md
          files: |
            dist/GTA-Ranked-Studio-${{ env.RELEASE_TAG }}.zip
            dist/SHA256SUMS.txt
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          generate_release_notes: true
          make_latest: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
