name: Inspect GTA Ranked Studio Twitch range hotfix

on:
  push:
    paths:
      - ".github/workflows/inspect-twitch-range.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.4.1 and v0.4.2 patches and test Twitch ranges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-source
          tar -xJf source/GTA-Ranked-Studio-source-v0.4.0.tar.xz -C /tmp/gta-source
          APP="/tmp/gta-source/gta-ranked-studio"
          python source/apply-hotfix-v0.4.1.py "$APP"
          python source/apply-hotfix-v0.4.2.py "$APP"
          echo "=== Patched version ==="
          cat "$APP/VERSION.txt"
          echo "=== Download range API usage ==="
          grep -n -B 4 -A 5 'build_twitch_download_ranges\|download_ranges\|download_sections' "$APP/studio/web/highlights.py"
          echo "=== Installer preservation whitelist ==="
          grep -n 'NOTES-v0.4.1\|NOTES-v0.4.2\|VERIFICATION-v0.4.2' "$APP"/installer/*.ps1
          python -m pip install --disable-pip-version-check pytest -r "$APP/requirements.txt"
          cd "$APP"
          python -m pytest -q tests/test_twitch_download_ranges.py tests/test_probe_timeout.py
